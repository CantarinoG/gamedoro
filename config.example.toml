# gamedoro settings: ~/.config/gamedoro/config.toml (install.sh creates it from this)
# Command-line flags override these. Edits are picked up while gamedoro runs
# and apply from the next cycle (the overlay setting needs a restart).

# Minutes of play allowed per cycle.
play = 50

# Minutes your games stay frozen afterwards.
block = 10

# Extra play minutes granted each time a game launches (loading isn't play
# time). Capped at play + launch_bonus, so relaunching can't stack it up.
# (Older configs call this first_bonus; that name still works.)
launch_bonus = 10

# Show the countdown overlay and wait for Enter. false = blocks just end.
overlay = true

# Stop the game (SIGSTOP) during a block. false = nothing is stopped: the
# overlay (dark, but enough to see and pause the game) is the only thing
# blocking you, and the game keeps running underneath. Stopping a game for
# minutes can leave it hung when it resumes (GTA IV does).
freeze = true

# While a game is frozen it is thawed for pulse_for_seconds every
# pulse_every_seconds, so no single stall gets long: a game stopped for
# minutes sees its clock jump and can come back stuck. Costs a brief blip of
# game sound/frames each pulse. pulse_every_seconds = 0 turns this off.
# (Seconds, unlike the settings above which are minutes.)
pulse_every_seconds = 30
pulse_for_seconds = 1

# Just before freezing a game, if its window has the keyboard focus, gamedoro
# presses this key in it so the game pauses itself first. An X keysym name,
# e.g. "Escape" or "p"; "" turns it off. Pause keys usually toggle, so a game
# that is already paused would be resumed. Not sent if the game isn't focused.
pause_key = "Escape"
# How long to wait after the key before freezing, for the game to react.
pause_wait_seconds = 4

# Sound played once when the block ends and the overlay asks for Enter.
# "default" = a stock system sound, a path to a sound file, or "" for none.
sound = "default"
