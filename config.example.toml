# gamedoro settings: ~/.config/gamedoro/config.toml (install.sh creates it from this)
# Command-line flags override these. Edits are picked up while gamedoro runs
# and apply from the next cycle (the overlay setting needs a restart).

# Minutes of play allowed per cycle.
play = 50

# Minutes your games stay frozen afterwards.
block = 10

# Extra play minutes granted each time a game launches (loading isn't play
# time). Capped at play + launch_bonus, so relaunching can't stack it up.
# (Older configs call this first_bonus; that name still works.)
launch_bonus = 10

# Show the countdown overlay and wait for Enter. false = blocks just end.
overlay = true
